<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BOMB BLAST 2D — 2D 炸彈人對戰</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div id="cards"></div>
    <div id="topbar">
      <div id="round">ROUND 1</div>
      <div id="timer">02:30</div>
    </div>
  </div>

  <div id="center-msg"></div>
  <div id="toast"></div>

  <div id="touch">
    <div class="pad">
      <button id="t-up"    class="tb">▲</button>
      <button id="t-left"  class="tb">◀</button>
      <button id="t-right" class="tb">▶</button>
      <button id="t-down"  class="tb">▼</button>
    </div>
    <button id="t-bomb" class="tb bomb">💣</button>
  </div>

  <div id="overlay"></div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
